<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sou West Strummers</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        body {
            margin: 0;
            background: #f5f2ec;
            color: #2b2118;
            font-family: Arial, sans-serif;
        }

        #pdfPages {
            display: grid;
            gap: 1rem;
            justify-items: center;
            padding: 1rem 0.5rem 2rem;
        }

        canvas {
            width: min(100%, 960px);
            height: auto;
            background: white;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        }

        .viewer-message {
            max-width: 32rem;
            margin: 2rem auto;
            padding: 1rem;
            text-align: center;
        }

        .viewer-actions {
            display: flex;
            justify-content: flex-end;
            padding: 0.75rem 0.75rem 0;
        }

        .viewer-actions button {
            font: inherit;
            cursor: pointer;
        }

        /* .nav-item sets display, which would otherwise beat the UA rule
           for [hidden] and leave the button on screen with nothing to print. */
        .viewer-actions button[hidden] {
            display: none;
        }

        @media print {
            .viewer-actions { display: none; }
        }
    </style>
</head>
<body>
    <div class="viewer-actions">
        <button id="printPdf" class="nav-item nav-button" type="button" hidden>Print</button>
    </div>
    <main id="pdfPages" aria-live="polite"></main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const pages = document.getElementById('pdfPages');
        const printButton = document.getElementById('printPdf');
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');

        // Resolved once so both the renderer and the print handler share it.
        const pdfUrl = file ? new URL(file, window.location.href) : null;
        const isSameOrigin = Boolean(pdfUrl) && pdfUrl.origin === window.location.origin;

        function showMessage(message) {
            pages.innerHTML = `<p class="viewer-message">${message}</p>`;
        }

        // The pages above are canvases, so printing this document would send
        // the printer a screen-resolution bitmap. Hand the browser the real
        // PDF instead: its built-in viewer prints it at full quality.
        function openPdfForPrinting() {
            window.open(pdfUrl.href, '_blank', 'noopener');
        }

        if (isSameOrigin) {
            printButton.hidden = false;
            printButton.addEventListener('click', openPdfForPrinting);

            document.addEventListener('keydown', (event) => {
                if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'p') {
                    event.preventDefault();
                    openPdfForPrinting();
                }
            });
        }

        async function renderPdf() {
            if (!file) {
                showMessage('No PDF was selected.');
                return;
            }

            if (!isSameOrigin) {
                showMessage('This viewer can only open PDFs from this website.');
                return;
            }

            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl.href).promise;
                pages.innerHTML = '';

                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                    const page = await pdf.getPage(pageNumber);
                    const unscaledViewport = page.getViewport({ scale: 1 });
                    const targetWidth = Math.min(window.innerWidth - 16, 960);
                    const viewport = page.getViewport({ scale: targetWidth / unscaledViewport.width });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    canvas.setAttribute('aria-label', `Page ${pageNumber}`);
                    pages.appendChild(canvas);

                    await page.render({ canvasContext: context, viewport }).promise;
                }
            } catch (error) {
                console.error('Unable to render PDF', error);
                showMessage('Sorry, this PDF could not be displayed. Please try again later.');
            }
        }

        renderPdf();
    </script>
</body>
</html>
